{% extends 'pos/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-4 sm:py-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        
        <!-- Header -->
        <div class="p-6 sm:p-7 border-b border-slate-100 bg-gradient-to-b from-slate-50/70 to-white flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">
                        Cliente #{{ client.id }}
                    </span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-brand-100 text-brand-500 border border-brand-200">
                        Titular de Crédito
                    </span>
                </div>
                <h1 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">Editar Cliente</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Actualiza el nombre, datos de contacto y dirección del cliente.</p>
            </div>

            <a href="{% url 'clients' %}" 
               class="inline-flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl font-bold text-xs sm:text-sm transition active:scale-95 border border-slate-200/80 shadow-2xs self-start sm:self-auto">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Volver a Clientes</span>
            </a>
        </div>

        <!-- Form Body -->
        <form method="post" class="p-6 sm:p-7 space-y-5">
            {% csrf_token %}

            <!-- Nombre -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Nombre Completo <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        name="name" 
                        value="{{ client.name }}" 
                        required
                        placeholder="Ej: Juan Pérez"
                        class="w-full bg-slate-50 hover:bg-white focus:bg-white text-slate-800 font-medium pl-11 pr-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition outline-none text-sm sm:text-base shadow-2xs"
                    />
                </div>
            </div>

            <!-- Grid: Teléfono & Email -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Teléfono / WhatsApp
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            name="phone" 
                            value="{{ client.phone }}"
                            placeholder="Ej: 3001234567"
                            class="w-full bg-slate-50 hover:bg-white focus:bg-white text-slate-800 font-medium pl-11 pr-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition outline-none text-sm sm:text-base shadow-2xs"
                        />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Correo Electrónico
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <input 
                            type="email" 
                            name="email" 
                            value="{{ client.email }}"
                            placeholder="cliente@ejemplo.com"
                            class="w-full bg-slate-50 hover:bg-white focus:bg-white text-slate-800 font-medium pl-11 pr-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition outline-none text-sm sm:text-base shadow-2xs"
                        />
                    </div>
                </div>
            </div>

            <!-- Dirección -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Dirección de Residencia o Negocio
                </label>
                <div class="relative">
                    <textarea 
                        name="address" 
                        rows="2"
                        placeholder="Ej: Calle 10 # 5-20, Barrio Centro"
                        class="w-full bg-slate-50 hover:bg-white focus:bg-white text-slate-800 font-medium p-3.5 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition outline-none text-sm sm:text-base shadow-2xs"
                    >{{ client.address }}</textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 flex flex-col sm:flex-row items-center gap-3">
                <button 
                    type="submit"
                    class="w-full sm:flex-1 py-3.5 px-6 bg-brand-500 hover:bg-brand-400 text-white font-extrabold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 active:scale-98 flex items-center justify-center gap-2 text-sm sm:text-base"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>Guardar Cambios</span>
                </button>

                <a 
                    href="{% url 'clients' %}"
                    class="w-full sm:w-auto py-3.5 px-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition active:scale-98 text-center text-xs sm:text-sm"
                >
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
