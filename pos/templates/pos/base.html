<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FleasoDaPos</title>
    
    <!-- PWA & Apple iOS Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FleasoDaPos">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/logo.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/logo.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <meta name="theme-color" content="#5592a3">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            100: '#f9f9f5',
                            200: '#e7ecda',
                            300: '#cddecc',
                            400: '#3f897a',
                            500: '#5592a3',
                        }
                    }
                }
            }
        }
    </script>
    <script src="//unpkg.com/alpinejs" defer></script>
</head>

<body class="bg-brand-100 min-h-screen font-sans text-brand-500" style="padding-bottom: max(5rem, calc(4.5rem + env(safe-area-inset-bottom, 0px)));">

    <!-- Desktop Sidebar / Mobile Hide -->
    <div class="hidden md:flex flex-col w-64 fixed inset-y-0 bg-white border-r border-brand-200">
        <div class="h-16 flex items-center justify-center border-b border-brand-200">
            <h1 class="text-2xl font-bold text-brand-500">POS System</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="{% url 'dashboard' %}"
                class="flex items-center px-4 py-2 text-brand-500 hover:bg-brand-200 rounded-lg transition font-medium">
                <svg class="w-5 h-5 mr-3 text-brand-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Inicio
            </a>
            <a href="{% url 'pos' %}" class="flex items-center px-4 py-2 text-brand-500 hover:bg-brand-200 rounded-lg transition font-medium">
                <svg class="w-5 h-5 mr-3 text-brand-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                Vender (POS)
            </a>
            <a href="{% url 'inventory' %}"
                class="flex items-center px-4 py-2 text-brand-500 hover:bg-brand-200 rounded-lg transition font-medium">
                <svg class="w-5 h-5 mr-3 text-brand-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
                Inventario
            </a>
            <a href="{% url 'clients' %}"
                class="flex items-center px-4 py-2 text-brand-500 hover:bg-brand-200 rounded-lg transition font-medium">
                <svg class="w-5 h-5 mr-3 text-brand-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                Clientes
            </a>
            <a href="{% url 'reports' %}"
                class="flex items-center px-4 py-2 text-brand-500 hover:bg-brand-200 rounded-lg transition font-medium">
                <svg class="w-5 h-5 mr-3 text-brand-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                Informes
            </a>
            <form action="{% url 'logout' %}" method="post" class="mt-auto">
                {% csrf_token %}
                <button type="submit"
                    class="w-full flex items-center px-4 py-2 text-red-500 hover:bg-red-100 rounded-lg transition font-medium">
                    <svg class="w-5 h-5 mr-3 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    Cerrar Sesión
                </button>
            </form>
        </nav>
    </div>

    <!-- Main Content -->
    <main class="md:ml-64 p-4 min-h-screen">
        {% if messages %}
        <div class="fixed top-4 right-4 z-50 space-y-2">
            {% for message in messages %}
            <div class="bg-brand-400 text-white px-4 py-2 rounded-lg shadow-lg" x-data="{show: true}" x-show="show"
                x-init="setTimeout(() => show = false, 3000)">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Bottom Nav -->
    <div class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-brand-200 flex justify-around items-center pt-2 px-1 z-40 shadow-lg"
         style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 0px));">
        <a href="{% url 'dashboard' %}" class="flex flex-col items-center justify-center flex-1 py-1 text-xs text-brand-500 hover:text-brand-400 active:scale-95 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span class="font-medium">Inicio</span>
        </a>
        <a href="{% url 'pos' %}" class="flex flex-col items-center justify-center flex-1 py-1 text-xs text-brand-500 hover:text-brand-400 active:scale-95 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span class="font-medium">POS</span>
        </a>
        <a href="{% url 'inventory' %}" class="flex flex-col items-center justify-center flex-1 py-1 text-xs text-brand-500 hover:text-brand-400 active:scale-95 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
            <span class="font-medium">Items</span>
        </a>
        <a href="{% url 'clients' %}" class="flex flex-col items-center justify-center flex-1 py-1 text-xs text-brand-500 hover:text-brand-400 active:scale-95 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span class="font-medium">Clientes</span>
        </a>
        <a href="{% url 'reports' %}" class="flex flex-col items-center justify-center flex-1 py-1 text-xs text-brand-500 hover:text-brand-400 active:scale-95 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
            <span class="font-medium">Informes</span>
        </a>
        <form action="{% url 'logout' %}" method="post" class="flex-1 flex justify-center m-0">
            {% csrf_token %}
            <button type="submit" class="flex flex-col items-center justify-center py-1 text-xs text-red-500 hover:text-red-600 active:scale-95 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                <span class="font-medium">Salir</span>
            </button>
        </form>
    </div>

    <!-- Use this for CSRF in HTMX -->
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered!', reg))
                    .catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>

</html>
