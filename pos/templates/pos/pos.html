{% extends 'pos/base.html' %} {% load humanize %} {% block content %}
<div
  class="h-[calc(100vh-80px)] flex flex-col md:flex-row gap-4 relative"
  x-data="{ 
    cartOpen: false, 
    clientId: '', 
    clientName: '', 
    defaultClientId: '{{ default_client.id|default:'' }}',
    defaultClientName: '{{ default_client.name|default:'CONTADO POS'|escapejs }}',
    cartCount: {{ cart_items|length|default:0 }},
    cartTotal: {{ cart_total|default:0 }}
  }"
  @item-added.window="cartCount = ($event.detail && $event.detail.count !== undefined) ? $event.detail.count : (cartCount + 1); if ($event.detail && $event.detail.total !== undefined) cartTotal = $event.detail.total;"
  @cart-updated.window="if ($event.detail) { cartCount = $event.detail.count; cartTotal = $event.detail.total; }"
  @cart-cleared.window="cartCount = 0; cartTotal = 0;"
  @cart-dom-checked.window="if ($event.detail.count !== undefined && $event.detail.count === 0 && cartCount > 0) { cartCount = 0; cartTotal = 0; }"
>
  <!-- Left Side: Product Search & Grid -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Notification Toast for Scan / Cart Feedback -->
    <div id="pos-scan-notification" class="fixed top-5 left-1/2 -translate-x-1/2 z-[90] max-w-sm w-[90%] px-4 py-3 rounded-2xl shadow-xl text-white font-bold text-sm text-center transition-all duration-300 pointer-events-none opacity-0 -translate-y-6"></div>

    <!-- Search Bar & Direct Camera Scanner -->
    <div
      class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-brand-200 mb-3 md:mb-4 shrink-0"
    >
      <div class="relative flex items-center">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg pointer-events-none">🔍</span>
        <input
          type="text"
          id="pos-search-input"
          name="search"
          placeholder="Buscar artículo o escanear código..."
          class="w-full p-3 pl-10 pr-28 sm:pr-32 bg-brand-50 rounded-lg border border-brand-100 focus:ring-2 focus:ring-brand-500 text-slate-800 text-sm md:text-base outline-none"
          hx-get="{% url 'search_products' %}"
          hx-trigger="keyup changed delay:200ms, search"
          hx-target="#pos-results"
          autofocus
          autocomplete="off"
        />
        <button type="button" 
                onclick="openPosCameraScanner()"
                class="absolute right-2 top-1/2 -translate-y-1/2 px-2.5 py-1.5 rounded-lg bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs transition active:scale-95 flex items-center gap-1.5 shadow-2xs"
                title="Escanear código de barras con la cámara y agregar al carrito">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Cámara</span>
        </button>
      </div>
    </div>

    <!-- Scrollable Grid -->
    <div
      id="pos-results"
      class="flex-1 overflow-y-auto grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 md:gap-3 content-start pb-24 md:pb-0"
    >
      <!-- Results load here -->
      <div
        class="col-span-full text-center text-gray-400 mt-20 flex flex-col items-center"
      >
        <span class="text-4xl mb-2">🔍</span>
        <p class="text-sm">Busca productos para agregar al carrito</p>
      </div>
    </div>
  </div>

  <!-- Mobile: Floating Cart Button -->
  <button
    id="mobile-floating-cart-bar"
    @click="cartOpen = true"
    class="md:hidden fixed bottom-20 left-4 right-4 bg-brand-500 hover:bg-brand-600 text-white shadow-xl rounded-2xl p-3.5 flex justify-between items-center font-bold z-40 active:scale-95 transition border border-brand-400/30"
    style="margin-bottom: env(safe-area-inset-bottom, 0px)"
  >
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-lg shadow-inner">
        🛒
      </div>
      <div class="text-left">
        <span class="block text-[10px] uppercase tracking-wider text-white/80 font-bold">Ver Carrito</span>
        <span class="text-xs font-black text-white">
          {{ cart_items|length }} artículo{{ cart_items|length|pluralize }}
        </span>
      </div>
    </div>
    <div class="bg-white text-slate-800 px-3.5 py-1.5 rounded-xl font-black font-mono text-sm shadow-xs border border-slate-100">
      ${{ cart_total|default:"0"|intcomma }}
    </div>
  </button>

  <!-- Mobile: Bottom Sheet Cart -->
  <div
    x-show="cartOpen"
    x-transition.opacity
    @click="cartOpen = false"
    class="md:hidden fixed inset-0 bg-black/50 z-50"
    style="display: none"
  >
    <div
      @click.stop
      x-show="cartOpen"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="translate-y-full"
      x-transition:enter-end="translate-y-0"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="translate-y-0"
      x-transition:leave-end="translate-y-full"
      class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl max-h-[85vh] flex flex-col"
    >
      <!-- Handle Bar -->
      <div class="flex justify-center pt-3 pb-2">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
      </div>

      <!-- Cart Header -->
      <div
        class="px-4 pb-3 border-b border-gray-200 flex justify-between items-center shrink-0"
      >
        <h2 class="font-bold text-lg text-gray-800">🛒 Carrito</h2>
        <div class="flex gap-2">
          <button
            class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1.5 rounded-lg font-medium transition"
            hx-post="{% url 'clear_cart' %}"
            hx-target="#cart-items"
          >
            Limpiar
          </button>
          <button
            @click="cartOpen = false"
            class="text-gray-400 hover:text-gray-600 p-1"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Cart Items -->
      <div
        id="cart-items"
        class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-50 min-h-0"
      >
        {% include 'pos/partials/cart_item_rows.html' %}
      </div>

      <!-- Checkout Form -->
      <div
        class="p-4 bg-white border-t border-gray-200 shrink-0 shadow-[0_-4px_12px_rgba(0,0,0,0.1)] max-h-[50vh] overflow-y-auto"
      >
        <form action="{% url 'checkout' %}" method="POST" class="space-y-3">
          {% csrf_token %}

          <!-- Client -->
          <div class="relative" x-data="{ searchOpen: false }">
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-bold text-gray-700">Cliente</label>
              <template x-if="!clientId">
                <span class="inline-flex items-center gap-1 text-[11px] font-black text-brand-700 bg-brand-100 px-2 py-0.5 rounded-md border border-brand-200">
                  ⚡ Consumidor Final: <span x-text="defaultClientName"></span>
                </span>
              </template>
              <template x-if="clientId">
                <span class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-md border border-emerald-200">
                  ✓ Cliente Asignado
                </span>
              </template>
            </div>
            
            <input type="hidden" name="client_id" :value="clientId || defaultClientId" />
            
            <div class="relative flex items-center">
              <input
                type="text"
                x-model="clientName"
                @input="searchOpen = true"
                @focus="searchOpen = true"
                @click.outside="searchOpen = false"
                :class="clientId ? 'border-emerald-500 bg-emerald-50/70 font-bold text-emerald-950 pr-8' : 'border-gray-300 bg-white'"
                class="w-full p-3 rounded-lg focus:ring-2 focus:ring-brand-500 transition text-sm outline-none"
                :placeholder="'🔍 Buscar otro cliente (opcional - por defecto ' + defaultClientName + ')...'"
                autocomplete="off"
                hx-get="{% url 'search_clients' %}"
                hx-trigger="keyup changed delay:200ms"
                hx-target="#client-search-results"
                name="client_search_display"
              />
              <button type="button" 
                      x-show="clientId" 
                      @click="clientId = ''; clientName = '';" 
                      class="absolute right-3 p-1 text-slate-400 hover:text-slate-700 text-xs font-bold"
                      title="Volver a Consumidor Final">
                ✕
              </button>
            </div>
            <div
              id="client-search-results"
              class="absolute z-50 w-full"
              x-show="searchOpen"
            ></div>
          </div>

          <!-- Date & Payment in Row -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1"
                >Fecha</label
              >
              <input
                type="datetime-local"
                name="created_at"
                class="w-full p-2.5 rounded-lg border border-gray-300 text-xs"
              />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1"
                >Pago</label
              >
              <select
                name="payment_method"
                class="w-full p-2.5 rounded-lg border border-gray-300 text-xs font-medium"
              >
                <option value="CASH">💵 Contado</option>
                <option value="CREDIT">📝 Crédito</option>
              </select>
            </div>
          </div>

          <!-- Note -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1"
              >Comentario</label
            >
            <textarea
              name="note"
              rows="2"
              class="w-full p-2.5 rounded-lg border border-gray-300 text-sm resize-none"
              placeholder="Detalles del trabajo..."
            ></textarea>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            :disabled="cartCount <= 0"
            :class="cartCount <= 0 ? 'opacity-40 cursor-not-allowed bg-slate-300' : 'bg-brand-500 hover:bg-brand-600 active:scale-95 shadow-lg'"
            class="w-full text-white font-extrabold py-4 rounded-xl transition flex justify-center items-center gap-2 text-lg tracking-wide"
          >
            <template x-if="cartCount <= 0">
              <span>CARRITO VACÍO</span>
            </template>
            <template x-if="cartCount > 0">
              <div class="flex items-center gap-2">
                <span>⚡ COBRAR</span>
                <template x-if="!clientId">
                  <span class="text-xs font-semibold text-white/90 bg-white/20 px-2 py-0.5 rounded-md">CONTADO</span>
                </template>
                <span class="font-mono text-xl font-black" x-text="'$' + Number(cartTotal).toLocaleString()"></span>
              </div>
            </template>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Desktop: Sidebar Cart (Hidden on Mobile) -->
  <div
    class="hidden md:flex w-96 bg-white rounded-xl shadow-lg border border-brand-200 flex-col h-full"
  >
    <!-- Cart Header -->
    <div
      class="p-4 border-b border-brand-200 bg-brand-600 text-white rounded-t-xl flex justify-between items-center shrink-0"
    >
      <h2 class="font-bold text-lg">🛒 Carrito</h2>
      <button
        class="text-xs bg-red-400 hover:bg-red-500 px-3 py-1.5 rounded-lg font-medium transition"
        hx-post="{% url 'clear_cart' %}"
        hx-target="#cart-items"
      >
        Limpiar
      </button>
    </div>

    <!-- Cart Items -->
    <div
      id="cart-items-desktop"
      class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-50"
    >
      {% include 'pos/partials/cart_item_rows.html' %}
    </div>

    <!-- Checkout Form -->
    <div class="p-4 bg-white border-t border-gray-200 shrink-0">
      <form action="{% url 'checkout' %}" method="POST" class="space-y-3">
        {% csrf_token %}

        <!-- Client -->
        <div class="relative" x-data="{ searchOpen: false }">
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-gray-700">Cliente</label>
            <template x-if="!clientId">
              <span class="inline-flex items-center gap-1 text-[11px] font-black text-brand-700 bg-brand-100 px-2 py-0.5 rounded-md border border-brand-200">
                ⚡ Consumidor Final: <span x-text="defaultClientName"></span>
              </span>
            </template>
            <template x-if="clientId">
              <span class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-md border border-emerald-200">
                ✓ Cliente Asignado
              </span>
            </template>
          </div>

          <input type="hidden" name="client_id" :value="clientId || defaultClientId" />
          
          <div class="relative flex items-center">
            <input
              type="text"
              x-model="clientName"
              @input="searchOpen = true"
              @focus="searchOpen = true"
              @click.outside="searchOpen = false"
              :class="clientId ? 'border-emerald-500 bg-emerald-50/70 font-bold text-emerald-950 pr-8' : 'border-gray-300 bg-white'"
              class="w-full p-2.5 rounded-lg focus:ring-2 focus:ring-brand-500 transition text-sm outline-none"
              :placeholder="'🔍 Buscar otro cliente (opcional - por defecto ' + defaultClientName + ')...'"
              autocomplete="off"
              hx-get="{% url 'search_clients' %}"
              hx-trigger="keyup changed delay:200ms"
              hx-target="#client-search-results-desktop"
              name="client_search_display"
            />
            <button type="button" 
                    x-show="clientId" 
                    @click="clientId = ''; clientName = '';" 
                    class="absolute right-2.5 p-1 text-slate-400 hover:text-slate-700 text-xs font-bold"
                    title="Volver a Consumidor Final">
              ✕
            </button>
          </div>
          <div
            id="client-search-results-desktop"
            class="absolute z-50 w-full"
            x-show="searchOpen"
          ></div>
        </div>

        <!-- Date & Payment -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1"
              >Fecha</label
            >
            <input
              type="datetime-local"
              name="created_at"
              class="w-full p-2 rounded-lg border border-gray-300 text-xs"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1"
              >Pago</label
            >
            <select
              name="payment_method"
              class="w-full p-2 rounded-lg border border-gray-300 text-xs"
            >
              <option value="CASH">💵 Contado</option>
              <option value="CREDIT">📝 Crédito</option>
            </select>
          </div>
        </div>

        <!-- Note -->
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1"
            >Comentario</label
          >
          <textarea
            name="note"
            rows="2"
            class="w-full p-2 rounded-lg border border-gray-300 text-sm resize-none"
            placeholder="Detalles..."
          ></textarea>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          :disabled="cartCount <= 0"
          :class="cartCount <= 0 ? 'opacity-40 cursor-not-allowed bg-slate-300' : 'bg-brand-500 hover:bg-brand-600 active:scale-95 shadow-md shadow-brand-500/20'"
          class="w-full text-white font-extrabold py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-base tracking-wide"
        >
          <template x-if="cartCount <= 0">
            <span>CARRITO VACÍO</span>
          </template>
          <template x-if="cartCount > 0">
            <div class="flex items-center gap-2">
              <span>⚡ COBRAR</span>
              <template x-if="!clientId">
                <span class="text-xs font-semibold text-white/90 bg-white/20 px-2 py-0.5 rounded-md">CONTADO</span>
              </template>
              <span class="font-mono text-lg font-black" x-text="'$' + Number(cartTotal).toLocaleString()"></span>
            </div>
          </template>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
function showPosNotification(msg, type = 'success') {
    const el = document.getElementById('pos-scan-notification');
    if (!el) return;
    el.innerText = msg;
    if (type === 'success') {
        el.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-[90] max-w-sm w-[90%] px-4 py-3 rounded-2xl shadow-xl text-white font-bold text-sm text-center transition-all duration-300 pointer-events-none bg-emerald-600 shadow-emerald-600/30 opacity-100 translate-y-0';
    } else {
        el.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-[90] max-w-sm w-[90%] px-4 py-3 rounded-2xl shadow-xl text-white font-bold text-sm text-center transition-all duration-300 pointer-events-none bg-amber-600 shadow-amber-600/30 opacity-100 translate-y-0';
    }
    setTimeout(() => {
        el.classList.replace('opacity-100', 'opacity-0');
        el.classList.replace('translate-y-0', '-translate-y-6');
    }, 2800);
}

// Escuchar evento itemAdded desde HTMX para mostrar feedback visual instantáneo
document.body.addEventListener('itemAdded', function(evt) {
    if (evt.detail && evt.detail.name) {
        showPosNotification(`✅ Agregado: ${evt.detail.name} ($${Number(evt.detail.price).toLocaleString()})`, 'success');
    }
});

// Escuchar evento cartError para notificar insumos o stock insuficientes
document.body.addEventListener('cartError', function(evt) {
    if (evt.detail && evt.detail.message) {
        showPosNotification(`⚠️ ${evt.detail.message}`, 'warning');
    }
});

function openPosCameraScanner() {
    openBarcodeScanner('pos-search-input', (scannedBarcode) => {
        // Enviar al endpoint de escaneo directo para sumar inmediatamente al carrito
        fetch("{% url 'scan_and_add_to_cart' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: new URLSearchParams({ barcode: scannedBarcode })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                // Actualizar carritos mobile y desktop
                const cartEl = document.getElementById('cart-items');
                const cartDesktopEl = document.getElementById('cart-items-desktop');
                if (cartEl) cartEl.innerHTML = data.cart_html;
                if (cartDesktopEl) cartDesktopEl.innerHTML = data.cart_html;
                
                const mobileFloatingBar = document.getElementById('mobile-floating-cart-bar');
                if (mobileFloatingBar) {
                    const totalEl = mobileFloatingBar.querySelector('.font-mono');
                    if (totalEl) totalEl.innerText = `$${Number(data.cart_total).toLocaleString()}`;
                    const countEl = mobileFloatingBar.querySelector('.text-xs.font-black');
                    if (countEl && data.cart_count !== undefined) {
                        countEl.innerText = `${data.cart_count} artículo${data.cart_count === 1 ? '' : 's'}`;
                    }
                }
                
                showPosNotification(`✅ Agregado: ${data.product_name} ($${Number(data.price).toLocaleString()})`, 'success');
                window.dispatchEvent(new CustomEvent('cartUpdated', { detail: { count: data.cart_count, total: data.cart_total } }));
            } else {
                const searchInput = document.getElementById('pos-search-input');
                if (searchInput) {
                    searchInput.value = scannedBarcode;
                    htmx.trigger(searchInput, 'search');
                }
                showPosNotification(data.message || `No se encontró producto con código: ${scannedBarcode}`, 'warning');
            }
        })
        .catch(err => {
            console.error(err);
            const searchInput = document.getElementById('pos-search-input');
            if (searchInput) {
                searchInput.value = scannedBarcode;
                htmx.trigger(searchInput, 'search');
            }
        });
    });
}

// Asegurar sincronización en vivo del carrito tras cualquier acción HTMX
document.body.addEventListener('htmx:afterSwap', function(evt) {
    const desktopCart = document.getElementById('cart-items-desktop');
    if (desktopCart) {
        const items = desktopCart.querySelectorAll('.group');
        window.dispatchEvent(new CustomEvent('cartDomChecked', { detail: { count: items.length } }));
    }
});
</script>
{% endblock %}
