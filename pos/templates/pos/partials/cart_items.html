{% load humanize %}
<!-- Contenido para el contenedor móvil #cart-items -->
<div id="cart-items-wrapper">
    {% include 'pos/partials/cart_item_rows.html' %}
</div>

<!-- OOB Swap para sincronizar automáticamente el carrito de escritorio -->
<div id="cart-items-desktop" hx-swap-oob="innerHTML">
    {% include 'pos/partials/cart_item_rows.html' %}
</div>

<!-- OOB Swap para actualizar en tiempo real el botón flotante en móvil -->
<button
  id="mobile-floating-cart-bar"
  hx-swap-oob="outerHTML"
  @click="cartOpen = true"
  class="md:hidden fixed bottom-20 left-4 right-4 bg-brand-500 hover:bg-brand-600 text-white shadow-xl rounded-2xl p-3.5 flex justify-between items-center font-bold z-40 active:scale-95 transition border border-brand-400/30"
  style="margin-bottom: env(safe-area-inset-bottom, 0px)"
>
  <div class="flex items-center gap-2.5">
    <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center shadow-inner">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
    </div>
    <div class="text-left">
      <span class="block text-[10px] uppercase tracking-wider text-white/80 font-bold">Ver Carrito</span>
      <span class="text-xs font-black text-white">
        {{ cart_items|length }} artículo{{ cart_items|length|pluralize }}
      </span>
    </div>
  </div>
  <div class="bg-white text-slate-800 px-3.5 py-1.5 rounded-xl font-black font-mono text-sm shadow-xs border border-slate-100">
    ${{ cart_total|default:"0"|intcomma }}
  </div>
</button>
