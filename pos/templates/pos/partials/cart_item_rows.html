{% load humanize %}
{% if cart_items %}
<div class="space-y-2">
    {% for item in cart_items %}
    <div class="flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-200 group relative shadow-2xs">
        <div class="flex-1 truncate pr-2">
            <div class="font-bold text-slate-800 text-sm truncate">{{ item.name }}</div>
            <div class="text-xs text-slate-400 font-mono mt-0.5">${{ item.price|intcomma }} c/u</div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-1 mr-2">
            <button type="button"
                class="w-7 h-7 flex items-center justify-center bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 font-bold text-sm active:scale-90 transition border border-slate-200"
                hx-post="{% url 'update_cart_item' %}" hx-vals='{"product_id": "{{ item.id }}", "action": "decrement"}'
                hx-target="#cart-items">
                -
            </button>

            <span class="text-xs font-bold w-6 text-center font-mono text-slate-800">{{ item.quantity }}</span>

            <button type="button"
                class="w-7 h-7 flex items-center justify-center bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 font-bold text-sm active:scale-90 transition border border-slate-200"
                hx-post="{% url 'update_cart_item' %}" hx-vals='{"product_id": "{{ item.id }}", "action": "increment"}'
                hx-target="#cart-items">
                +
            </button>
        </div>

        <div class="text-right flex flex-col items-end">
            <div class="font-black text-brand-600 text-sm font-mono">${{ item.subtotal|intcomma }}</div>
            <button type="button" class="text-[11px] font-semibold text-rose-500 hover:text-rose-700 mt-0.5 active:scale-95"
                hx-post="{% url 'update_cart_item' %}"
                hx-vals='{"product_id": "{{ item.id }}", "action": "remove"}' hx-target="#cart-items">
                ✕ Quitar
            </button>
        </div>
    </div>
    {% endfor %}
</div>

<div class="mt-4 pt-3 border-t border-slate-200">
    <div class="flex justify-between items-center text-base sm:text-lg font-black text-slate-800">
        <span>Total:</span>
        <span class="text-brand-600 font-mono text-xl">${{ cart_total|intcomma }}</span>
    </div>
</div>
{% else %}
<div class="text-center text-slate-400 py-10 flex flex-col items-center">
    <span class="text-4xl mb-2">🛒</span>
    <span class="text-sm font-medium">Carrito vacío</span>
    <span class="text-xs text-slate-400 mt-1">Busca o escanea artículos para agregar</span>
</div>
{% endif %}
